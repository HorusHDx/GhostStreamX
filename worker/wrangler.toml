# Config para desplegar el scrape proxy con Wrangler (CLI).
# Alternativa: copiar worker/proxy.js en el dashboard de Cloudflare
# (Workers & Pages > Create > Create Worker > pasted code).
#
# Uso:
#   npm i -g wrangler
#   wrangler login
#   wrangler deploy            # (o wrangler publish en versiones viejas)
#
# Variable opcional: SCRAPE_TOKEN (Settings > Variables en el dashboard)
# o editá TOKEN_FALLBACK dentro de proxy.js.

name = "ghoststreamx-scrape-proxy"
main = "proxy.js"
compatibility_date = "2025-01-01"